version: 2
updates:
  - package-ecosystem: uv
    directories:
      - plugins/mobile-mcp
      - plugins/apple-notes-mcp
      - plugins/chrome-mcp
    schedule:
      interval: weekly
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: site
    schedule:
      interval: weekly
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
