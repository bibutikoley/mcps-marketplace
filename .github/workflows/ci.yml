name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # Single entry point for every Python-side gate (marketplace
      # validation, reproducible locks, pytest suites, ruff, mypy).
      # Run the same command locally: ./scripts/verify.sh
      - name: Verify repository
        run: ./scripts/verify.sh

  auto-tag:
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-tag-main
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Tags the release train once a stamped version lands on main:
      # validate_release-gated, no-op when already tagged. Pushes with
      # RELEASE_TOKEN (a PAT) because tags pushed with GITHUB_TOKEN do
      # not trigger the tag-push release workflow. Skips cleanly until
      # the one-time secret setup is done (see CONTRIBUTING.md).
      - name: Tag release train
        run: python3 scripts/auto_tag.py
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build
