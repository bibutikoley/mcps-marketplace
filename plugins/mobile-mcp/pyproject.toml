[project]
name = "mobile-mcp"
version = "0.5.3"
description = "Unified MCP server for Android (ADB) and iOS (Xcode simctl/devicectl) device control"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<3",
]

[project.scripts]
mobile-mcp = "main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "android", "ios"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
show_error_codes = true
