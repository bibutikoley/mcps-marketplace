[project]
name = "apple-notes-mcp"
version = "0.5.2"
description = "MCP server giving Claude Code CRUD access to Apple Notes via AppleScript"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.10.3,<4",
    "markdownify>=1.2.3,<2",
    "mcp>=1.0,<3",
]

[project.scripts]
apple-notes-mcp = "main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "notes"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
show_error_codes = true

[[tool.mypy.overrides]]
module = ["markdown", "markdownify"]
ignore_missing_imports = true
